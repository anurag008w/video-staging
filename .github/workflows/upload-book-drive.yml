name: Upload textbook PDF to Drive
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Official source URL (ncert.nic.in or books.ebalbharati.in)
        required: true
        type: string
      kind:
        description: pdf or ncert_zip
        required: true
        type: string
      source_sha256:
        description: Expected SHA-256 of the downloaded source file
        required: true
        type: string
      expected_pages:
        description: Expected page count of the final PDF
        required: true
        type: string
      folder_id:
        description: Destination Drive folder ID
        required: true
        type: string
      folder_name:
        description: Expected destination folder name
        required: true
        type: string
      file_name:
        description: Destination file name
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: book-drive-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests && sudo apt-get install -y -qq qpdf
      - name: Download from official source, verify, upload privately
        env:
          DRIVE_CREDENTIAL: ${{ secrets.EPISODE_DRIVE_OAUTH }}
          SOURCE_URL: ${{ inputs.source_url }}
          KIND: ${{ inputs.kind }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          EXPECTED_PAGES: ${{ inputs.expected_pages }}
          FOLDER_ID: ${{ inputs.folder_id }}
          FOLDER_NAME: ${{ inputs.folder_name }}
          FILE_NAME: ${{ inputs.file_name }}
        run: python scripts/upload_book_drive.py
