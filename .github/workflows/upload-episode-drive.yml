name: Upload original episode to Drive
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Original MP4 release asset URL in this repository
        required: true
        type: string
      sha256:
        description: Expected original file SHA-256
        required: true
        type: string
      episode_name:
        description: Destination video filename
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: episode-drive-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Verify master and upload privately
        env:
          DRIVE_CREDENTIAL: ${{ secrets.EPISODE_DRIVE_OAUTH }}
          SOURCE_URL: ${{ inputs.source_url }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          EPISODE_NAME: ${{ inputs.episode_name }}
        run: python scripts/upload_episode_drive.py
      - name: Save non-secret upload verification
        uses: actions/upload-artifact@v4
        with:
          name: episode-upload-verification
          path: upload-result.json
          retention-days: 7
